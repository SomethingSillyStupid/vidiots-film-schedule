name: Update Vidiots calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate calendar
        run: python scripts/generate_vidiots_ics.py

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p public
          cp output/vidiots.ics public/vidiots.ics
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Vidiots Film Schedule</title>
            </head>
            <body>
              <h1>Vidiots Film Schedule</h1>
              <p><a href="vidiots.ics">Subscribe or download the calendar</a></p>
            </body>
          </html>
          HTML

      - name: Commit updated calendar
        run: |
          if [ -z "$(git status --porcelain -- output/vidiots.ics)" ]; then
            echo "Calendar is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/vidiots.ics
            git commit -m "Update Vidiots calendar"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
