name: Update Vidiots calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile-check generator and validator
        run: |
          PYTHONPYCACHEPREFIX=/tmp/vidiots-pycache python -m py_compile scripts/generate_vidiots_ics.py scripts/validate_ics.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate calendar
        run: python scripts/generate_vidiots_ics.py

      - name: Validate generated calendar
        run: python scripts/validate_ics.py output/vidiots.ics

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p public
          cp output/vidiots.ics public/vidiots.ics
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Vidiots Film Schedule</title>
              <style>
                :root {
                  color-scheme: light;
                  --ink: #181818;
                  --muted: #5c5c5c;
                  --paper: #fffdf8;
                  --panel: #ffffff;
                  --accent: #e6007a;
                  --line: #ded8ce;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  background: var(--paper);
                  color: var(--ink);
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  line-height: 1.55;
                }

                main {
                  width: min(1120px, calc(100% - 32px));
                  margin: 0 auto;
                  padding: 48px 0;
                }

                header {
                  max-width: 760px;
                  margin-bottom: 36px;
                }

                h1 {
                  margin: 0 0 12px;
                  font-size: clamp(2rem, 5vw, 4.25rem);
                  line-height: 1;
                }

                h2 {
                  margin: 0 0 14px;
                  font-size: 1.25rem;
                }

                p {
                  margin: 0 0 14px;
                }

                a {
                  color: var(--accent);
                  font-weight: 700;
                }

                .lead {
                  color: var(--muted);
                  font-size: 1.1rem;
                }

                .actions {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 12px;
                  margin: 24px 0 0;
                }

                .button {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 44px;
                  padding: 0 18px;
                  border: 2px solid var(--ink);
                  border-radius: 6px;
                  background: var(--accent);
                  color: #fff;
                  text-decoration: none;
                }

                .button.secondary {
                  background: transparent;
                  color: var(--ink);
                }

                .url {
                  display: block;
                  overflow-wrap: anywhere;
                  padding: 12px 14px;
                  border: 1px solid var(--line);
                  border-radius: 6px;
                  background: #faf7f0;
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.92rem;
                }

                .grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                  gap: 16px;
                  margin-top: 28px;
                }

                section {
                  padding: 20px;
                  border: 1px solid var(--line);
                  border-radius: 8px;
                  background: var(--panel);
                }

                ol {
                  margin: 0;
                  padding-left: 1.25rem;
                }

                li + li {
                  margin-top: 8px;
                }

                footer {
                  margin-top: 28px;
                  color: var(--muted);
                  font-size: 0.95rem;
                }
              </style>
            </head>
            <body>
              <main>
                <header>
                  <h1>Vidiots Film Schedule</h1>
                  <p class="lead">Subscribe once and your calendar app will keep up with upcoming Vidiots screenings as this feed refreshes.</p>
                  <div class="actions">
                    <a class="button" href="webcal://somethingsillystupid.github.io/vidiots-film-schedule/vidiots.ics">Subscribe</a>
                    <a class="button secondary" href="vidiots.ics">Download .ics</a>
                  </div>
                </header>

                <p>Calendar URL:</p>
                <code class="url">https://somethingsillystupid.github.io/vidiots-film-schedule/vidiots.ics</code>

                <div class="grid">
                  <section>
                    <h2>Mac Calendar</h2>
                    <ol>
                      <li>Copy the calendar URL above.</li>
                      <li>Open Calendar.</li>
                      <li>Choose File, then New Calendar Subscription.</li>
                      <li>Paste the URL, choose a refresh interval, then click Subscribe.</li>
                    </ol>
                  </section>

                  <section>
                    <h2>iPhone or iPad</h2>
                    <ol>
                      <li>Tap Subscribe above.</li>
                      <li>Confirm that you want to add the subscribed calendar.</li>
                      <li>If that does not open Calendar, copy the URL and add it in Settings, Calendar, Accounts, Add Account, Other, Add Subscribed Calendar.</li>
                    </ol>
                  </section>

                  <section>
                    <h2>Windows Outlook</h2>
                    <ol>
                      <li>Copy the calendar URL above.</li>
                      <li>Open Outlook on the web.</li>
                      <li>Go to Calendar, Add calendar, then Subscribe from web.</li>
                      <li>Paste the URL, name the calendar, and save.</li>
                    </ol>
                  </section>

                  <section>
                    <h2>Android</h2>
                    <ol>
                      <li>Copy the calendar URL above.</li>
                      <li>Open Google Calendar in a desktop browser.</li>
                      <li>Next to Other calendars, choose Add by URL.</li>
                      <li>Paste the URL. After it syncs, make sure the calendar is visible in the Google Calendar app on Android.</li>
                    </ol>
                  </section>
                </div>

                <footer>
                  <p>This independent calendar is generated from the public Vidiots screenings page and refreshes every six hours.</p>
                </footer>
              </main>
            </body>
          </html>
          HTML

      - name: Commit updated calendar
        run: |
          if [ -z "$(git status --porcelain -- output/vidiots.ics)" ]; then
            echo "Calendar is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/vidiots.ics
            git commit -m "Update Vidiots calendar"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
